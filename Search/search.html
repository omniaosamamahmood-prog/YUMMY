<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Yummy</title>
  <link rel="icon" href="../logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="meals-section">
    <div class="container">
      <h1 class="page-title">Search</h1>
      <div class="row search-fields mb-4">
        <div class="col-md-6 mb-3">
          <label class="visually-hidden" for="search-name">Search by name</label>
          <input type="text" id="search-name" class="form-control" placeholder="Search by name">
        </div>
        <div class="col-md-6 mb-3">
          <label class="visually-hidden" for="search-letter">Search by first letter</label>
          <input type="text" id="search-letter" maxlength="1" class="form-control" placeholder="Search by first letter">
        </div>
      </div>
      <div class="row g-4" id="meals-container"></div>
    </div>
  </main>
  <script src="../js/shared.js"></script>
  <script src="search.js"></script>
</body>
</html>
