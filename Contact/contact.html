<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Yummy</title>
  <link rel="icon" href="../logo.png">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="meals-section">
    <div class="container">
      <h1 class="page-title text-center">Contact Us</h1>
      <form id="myForm" class="row g-3 justify-content-center">
        <div class="col-md-5">
          <label class="visually-hidden" for="name">Full name</label>
          <input type="text" id="name" class="form-control" placeholder="Full Name" required>
          <small class="text-danger d-none" id="nameError">Enter a valid name (only letters)</small>
        </div>
        <div class="col-md-5">
          <label class="visually-hidden" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Email" required>
          <small class="text-danger d-none" id="emailError">Enter a valid email</small>
        </div>
        <div class="col-md-5">
          <label class="visually-hidden" for="phone">Phone</label>
          <input type="tel" id="phone" class="form-control" placeholder="Phone (e.g. 01123456789)" required>
          <small class="text-danger d-none" id="phoneError">Enter a valid phone number</small>
        </div>
        <div class="col-md-5">
          <label class="visually-hidden" for="age">Age</label>
          <input type="number" id="age" class="form-control" placeholder="Age" required>
          <small class="text-danger d-none" id="ageError">Age must be between 10 and 100</small>
        </div>
        <div class="col-md-5">
          <label class="visually-hidden" for="password">Password</label>
          <div class="position-relative">
            <input type="password" id="password" class="form-control pe-5" placeholder="Password" required>
            <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3 toggle-password" toggle="#password" style="cursor: pointer; color: #888;"></i>
          </div>
          <small class="text-danger d-none" id="passwordError">
            Password must be at least 6 chars, include a number & letter
          </small>
        </div>
        <div class="col-md-5">
          <label class="visually-hidden" for="confirmPassword">Confirm password</label>
          <div class="position-relative">
            <input type="password" id="confirmPassword" class="form-control pe-5" placeholder="Confirm Password" required>
            <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3 toggle-password" toggle="#confirmPassword" style="cursor: pointer; color: #888;"></i>
          </div>
          <small class="text-danger d-none" id="confirmPasswordError">Passwords don't match</small>
        </div>
        <div class="col-12 text-center">
          <button type="submit" id="submitBtn" class="btn btn-outline-danger" disabled>Submit</button>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/shared.js"></script>
  <script src="contact.js"></script>
</body>
</html>
